name: Sync from upstream

# Runs ONLY in the client repo. Pulls main from the public upstream repo
# using this repo's own GITHUB_TOKEN (no personal token needed).
# Non-destructive: fast-forwards when possible, otherwise MERGES (no force push,
# no history rewrite). On conflicting hunks the upstream version wins.
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-upstream
  cancel-in-progress: false

jobs:
  pull:
    if: github.repository == 'hedi4060/Marche-direct-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main (no history rewrite)
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git fetch https://github.com/syntralogic/marchesdirect-backend.git main
          if git merge --ff-only FETCH_HEAD; then
            echo "fast-forwarded"
          else
            git merge --no-edit --allow-unrelated-histories -X theirs FETCH_HEAD
          fi
          git push origin HEAD:main
